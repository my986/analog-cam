<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HEISEI CAM">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>HEISEI CAM</title>
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f5;
    --dim: #8a8a8a;
    --accent: #ffd60a;
    --rec: #ff3b30;
    --panel: rgba(28, 28, 30, .92);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; -webkit-touch-callout: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
  /* immediate press feedback (iOS needs a touchstart listener for :active, see script) */
  #levels button, #thumb, #flip, #clock, #sheet .btns > * { transition: transform .08s, opacity .08s; }
  #levels button:active, #thumb:active, #flip:active, #clock:active, #sheet .btns > *:active { transform: scale(.9); opacity: .7; }
  #shutter:active span { transform: scale(.88); }
  #modes button:active { opacity: .6; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; height: 100dvh; }

  #top { flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; font-size: 13px; }
  #spec { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 90px; }
  #timer { font-variant-numeric: tabular-nums; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
  #timer .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; vertical-align: 1px; }
  #app.recording #timer { background: var(--rec); }
  #app.recording #timer .dot { background: #fff; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #top .spacer { min-width: 90px; text-align: right; }
  #clock { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,.12); font-variant-numeric: tabular-nums; }

  #finder { flex: 1; position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #finder, #view { touch-action: none; }
  #view { width: 100%; height: 100%; object-fit: contain; display: block; }
  #toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(0,0,0,.7); padding: 8px 14px; border-radius: 16px; font-size: 13px;
    opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; }
  #eraFlash { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 700;
    color: var(--accent); background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #eraFlash.show { opacity: 1; }

  #controls { flex: none; padding: 8px 0 calc(env(safe-area-inset-bottom) + 18px); }
  #levels { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
  #levels .lab { font-size: 11px; color: var(--dim); align-self: center; margin-right: 2px; }
  #levels button { width: 42px; height: 42px;border-radius: 50%; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 600; }
  #levels button.on { background: rgba(255,255,255,.22); color: var(--accent); }

  #modes { position: relative; display: flex; gap: 6px; overflow-x: auto; touch-action: pan-x; scroll-snap-type: x mandatory; scrollbar-width: none;
    padding: 4px 50%; margin-bottom: 14px; }
  #modes::-webkit-scrollbar { display: none; }
  #modes button { flex: none; scroll-snap-align: center; text-align: center; color: var(--dim); line-height: 1.15; transition: color .2s, opacity .08s;
    padding: 8px 10px; min-height: 44px; }
  #modes button b { display: block; font-size: 15px; letter-spacing: .04em; }
  #modes button small { font-size: 11px; }
  #modes button.on { color: var(--accent); }

  #row { display: flex; align-items: center; justify-content: space-between; padding: 0 36px; }

  /* Landscape phone: viewfinder on the left, controls in a column on the right like a camera app */
  @media (orientation: landscape) and (max-height: 600px) {
    #app { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; }
    #top { grid-area: 1 / 1; padding: calc(env(safe-area-inset-top) + 6px) 12px 4px calc(env(safe-area-inset-left) + 12px); }
    #finder { grid-area: 2 / 1; padding: 0 0 calc(env(safe-area-inset-bottom) + 6px) env(safe-area-inset-left); }
    #controls { grid-area: 1 / 2 / 3 / 3; display: flex; align-items: stretch; gap: 16px;
      padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 10px) 4px; }
    #picker { display: flex; flex-direction: column; justify-content: center; gap: 10px; }
    #levels { margin: 0; justify-content: flex-start; }
    #levels .lab { display: none; }
    #modes { flex-direction: column; overflow: visible; padding: 0; margin: 0; gap: 0; scroll-snap-type: none; touch-action: manipulation; }
    #modes button { display: flex; align-items: baseline; gap: 8px; text-align: left; min-height: 40px; padding: 8px 6px; }
    #modes button b { display: inline; }
    #row { flex-direction: column; justify-content: space-between; padding: 0; }
  }
  #thumb { width: 48px; height: 48px; border-radius: 8px; background: #222 center/cover no-repeat; border: 2px solid rgba(255,255,255,.2); }
  #thumb:disabled { opacity: .35; }
  #shutter { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; display: grid; place-items: center; }
  #shutter span { width: 60px; height: 60px; border-radius: 50%; background: var(--rec); transition: all .2s; }
  #app.recording #shutter span { width: 30px; height: 30px; border-radius: 6px; }
  #flip { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; }
  #flip:disabled { opacity: .35; }

  #splash { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; z-index: 10; }
  #splash h1 { margin: 0; font-size: 34px; letter-spacing: .12em; font-family: "Courier New", monospace; }
  #splash p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.7; }
  #start { background: var(--accent); color: #000; font-weight: 700; padding: 14px 32px; border-radius: 28px; font-size: 16px; }

  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px 16px calc(env(safe-area-inset-bottom) + 24px); }
  #sheet[hidden] { display: none; }
  #sheet video { width: 100%; max-height: 65dvh; background: #000; border-radius: 8px; }
  #sheet .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #sheet .btns button, #sheet .btns a { padding: 12px 22px; border-radius: 22px; background: rgba(255,255,255,.14); font-weight: 600; color: var(--fg); text-decoration: none; font-size: 15px; }
  #sheet .btns .primary { background: var(--accent); color: #000; }
  #sheet .meta { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="spec"></div>
    <div id="timer"><span class="dot"></span><span id="time">00:00</span></div>
    <div class="spacer"><button id="clock" aria-label="日付スタンプの時刻表記"></button></div>
  </header>
  <main id="finder">
    <canvas id="view" width="640" height="480"></canvas>
    <div id="eraFlash"></div>
    <div id="toast"></div>
  </main>
  <section id="controls">
    <div id="picker">
      <div id="levels"><span class="lab">劣化</span></div>
      <div id="modes"></div>
    </div>
    <div id="row">
      <button id="thumb" disabled aria-label="最後に撮った動画"></button>
      <button id="shutter" aria-label="録画"><span></span></button>
      <button id="flip" aria-label="カメラ切替">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3 3 0 0 1 5.2-2"/><path d="M15 13a3 3 0 0 1-5.2 2"/><path d="M14 9.5V11h-1.5"/><path d="M10 16.5V15h1.5"/></svg>
      </button>
    </div>
  </section>
</div>

<div id="splash">
  <h1>HEISEI CAM</h1>
  <p>時代を選んで、録画ボタンを押すだけ。<br>平成初期のビデオを黎明期のネットに上げた画質で撮れます。</p>
  <button id="start">カメラを起動</button>
</div>

<div id="sheet" hidden>
  <video id="playback" playsinline controls loop></video>
  <div class="meta" id="clipMeta"></div>
  <div class="btns">
    <a id="save" class="primary">保存</a>
    <button id="share">共有</button>
    <button id="close">閉じる</button>
  </div>
</div>

<script>
'use strict';

// ---------- Presets: every knob lives here, the user only picks an era + one level ----------
const PRESETS = [
  { name: 'VHS原本', year: '1991', res: [320, 240], fps: 30, smooth: true,
    tape: 1.0, track: .5, bleed: 3.0, noise: .55, sat: .85, sharp: .9, head: 1, tint: [1.05, 1.0, .93], contrast: 1.04, bright: .02,
    q: 0, qc: 0, cut: 8, persist: .12, skip: 0, stall: 0, stamp: true, scan: true,
    audio: { lp: 7500, noise: .025, bits: 16 } },
  { name: 'RealVideo', year: '1997', res: [176, 144], fps: 10, smooth: true,
    tape: .6, track: .25, bleed: 2.5, noise: .3, sat: .9, sharp: .5, head: .6, tint: [1.02, 1.0, .96], contrast: 1.1, bright: 0,
    q: 3.6, qc: 5.5, cut: 3, persist: .3, skip: .18, stall: .12, stamp: true, scan: false,
    audio: { lp: 3800, noise: .012, bits: 8 } },
  { name: 'ダイヤルアップ', year: '1999', res: [160, 120], fps: 6, smooth: false,
    tape: .4, track: .2, bleed: 2.0, noise: .25, sat: .85, sharp: .3, head: .5, tint: [1.0, 1.0, 1.0], contrast: 1.15, bright: 0,
    q: 6.0, qc: 9.0, cut: 2, persist: .1, skip: .3, stall: .3, buffer: true, stamp: true, scan: false,
    audio: { lp: 2600, noise: .02, bits: 6 } },
  { name: 'ガラケー', year: '2003', res: [176, 144], fps: 15, smooth: false,
    tape: 0, track: 0, bleed: 1.2, noise: .35, sat: 1.35, sharp: 1.3, head: 0, tint: [.97, 1.04, .94], contrast: 1.22, bright: .03,
    q: 2.6, qc: 4.5, cut: 4, persist: 0, skip: .1, stall: 0, stamp: null, scan: false,
    audio: { lp: 3400, noise: .008, bits: 8 } },
  { name: '動画サイト', year: '2006', res: [320, 240], fps: 25, smooth: true,
    tape: .85, track: .35, bleed: 3.0, noise: .45, sat: .9, sharp: .8, head: 1, tint: [1.04, 1.0, .95], contrast: 1.06, bright: .01,
    q: 2.2, qc: 3.5, cut: 4, persist: .06, skip: .06, stall: 0, stamp: true, scan: false,
    audio: { lp: 6000, noise: .015, bits: 10 } },
];
const LEVELS = [{ label: '軽', m: .6 }, { label: '中', m: 1 }, { label: '重', m: 1.7 }];
let pi = 0, li = 1;

const $ = s => document.querySelector(s);
const app = $('#app'), out = $('#view'), octx = out.getContext('2d');

// ---------- WebGL2 pipeline ----------
const glc = document.createElement('canvas');
const gl = glc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, premultipliedAlpha: false });

const LQ = [16,11,10,16,24,40,51,61, 12,12,14,19,26,58,60,55, 14,13,16,24,40,57,69,56, 14,17,22,29,51,87,80,62,
            18,22,37,56,68,109,103,77, 24,35,55,64,81,104,113,92, 49,64,78,87,103,121,120,101, 72,92,95,98,112,100,103,99];
const CQ = [17,18,24,47,99,99,99,99, 18,21,26,66,99,99,99,99, 24,26,56,99,99,99,99,99, 47,66,99,99,99,99,99,99,
            ...Array(32).fill(99)];
const glslArr = a => `float[64](${a.map(v => v.toFixed(1)).join(',')})`;

const VS = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); gl_Position = vec4(p*2.-1., 0., 1.); }`;
const HEAD = `#version 300 es
precision highp float; precision highp int;
out vec4 o;
const float PI = 3.14159265;
float h(vec2 p){ p = fract(p*vec2(443.897,441.423)); p += dot(p, p.yx+19.19); return fract((p.x+p.y)*p.x); }
`;

// Pass 1: camera -> tape-resolution image with VHS artifacts
const FS_TAPE = HEAD + `
uniform sampler2D uSrc; uniform vec2 uRes; uniform float uTime; uniform vec4 uCrop; uniform float uMirror;
uniform float uTape, uTrack, uBleed, uNoise, uSat, uSharp, uHead, uContrast, uBright; uniform vec3 uTint;
vec3 toYIQ(vec3 c){ return mat3(.299,.596,.211, .587,-.274,-.523, .114,-.322,.312) * c; }
vec3 fromYIQ(vec3 c){ return mat3(1.,1.,1., .956,-.272,-1.106, .621,-.647,1.703) * c; }
vec3 src(vec2 v){ v = clamp(v, 0., 1.); if (uMirror > .5) v.x = 1. - v.x; return texture(uSrc, uCrop.zw + v*uCrop.xy).rgb; }
void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 v = vec2(fc.x/uRes.x, 1. - fc.y/uRes.y);
  float line = floor(v.y*uRes.y), fr = floor(uTime*30.), px = 1./uRes.x;
  float off = (h(vec2(line, fr)) - .5)*px*.9*uTape + sin(v.y*14. + uTime*2.3)*px*.6*uTape;
  float bp = fract(uTime*.06 + .3)*1.4 - .2;
  float band = smoothstep(.06, 0., abs(v.y - bp))*uTrack;
  off += band*(h(vec2(line, fr + 7.)) - .3)*px*12.;
  float hs = step(.965, v.y)*uHead;
  off += hs*(px*7. + h(vec2(line, fr))*px*6.);
  vec2 sv = v + vec2(off, 0.);

  float y0 = toYIQ(src(sv)).x;
  float y1 = (toYIQ(src(sv - vec2(px,0.))).x + toYIQ(src(sv + vec2(px,0.))).x + 2.*y0)*.25;
  float y2 = (toYIQ(src(sv - vec2(3.*px,0.))).x + toYIQ(src(sv + vec2(3.*px,0.))).x + 2.*y1)*.25;
  float y = mix(y0, y1, clamp(uTape, 0., 1.)*.7) + (y1 - y2)*uSharp;

  vec2 iq = vec2(0.);
  for (int i = 0; i < 5; i++) { float k = float(i) - 2.; iq += toYIQ(src(sv + vec2((k*uBleed*.5 + uBleed*.6)*px, 0.))).yz; }
  iq /= 5.;
  iq += (vec2(h(vec2(floor(fc.x/4.), line) + fr), h(vec2(line, floor(fc.x/5.)) + fr*1.3)) - .5)*.05*uNoise;
  iq *= uSat;

  y += (h(fc + fr*1.7) - .5)*.12*uNoise;
  y += band*h(fc*vec2(.3,1.) + fr)*.5;
  float dr = step(1. - .0015*uTape, h(vec2(floor(fc.x/24.), line + fr*3.1)));
  y = mix(y, 1., dr*.8);
  y = (y - .5)*uContrast + .5 + uBright;

  vec3 rgb = fromYIQ(vec3(y, iq))*uTint;
  rgb = mix(rgb, vec3(h(fc + fr)), hs*.3);
  vec2 d = v - .5; rgb *= 1. - uTape*.5*dot(d, d);
  o = vec4(clamp(rgb, 0., 1.), 1.);
}`;

// Passes 2-5: real 8x8 DCT -> quantize -> IDCT (separable), in YCbCr
const FS_DCT_H = HEAD + `
uniform sampler2D uIn;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy); int k = p.x % 8, b = p.x - k;
  vec3 s = vec3(0.);
  for (int n = 0; n < 8; n++) {
    vec3 c = texelFetch(uIn, ivec2(b + n, p.y), 0).rgb;
    vec3 ycc = vec3(dot(c, vec3(.299,.587,.114)) - .5, dot(c, vec3(-.168736,-.331264,.5)), dot(c, vec3(.5,-.418688,-.081312)));
    s += ycc*cos(float(2*n + 1)*float(k)*PI/16.);
  }
  o = vec4(s*(k == 0 ? .35355339 : .5), 1.);
}`;
const FS_DCT_V = HEAD + `
uniform sampler2D uIn; uniform float uQ, uQc, uCut;
const float LQ[64] = ${glslArr(LQ)};
const float CQ[64] = ${glslArr(CQ)};
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy); int k = p.y % 8, b = p.y - k, u = p.x % 8;
  vec3 s = vec3(0.);
  for (int n = 0; n < 8; n++) s += texelFetch(uIn, ivec2(p.x, b + n), 0).rgb*cos(float(2*n + 1)*float(k)*PI/16.);
  s *= (k == 0 ? .35355339 : .5);
  float ql = max(LQ[k*8 + u]/255.*uQ, 1e-4), qc = max(CQ[k*8 + u]/255.*uQc, 1e-4);
  s.x = round(s.x/ql)*ql;
  s.yz = round(s.yz/qc)*qc;
  if (float(u) >= uCut || float(k) >= uCut) s.yz = vec2(0.);
  o = vec4(s, 1.);
}`;
const FS_IDCT_V = HEAD + `
uniform sampler2D uIn;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy); int n = p.y % 8, b = p.y - n;
  vec3 s = vec3(0.);
  for (int k = 0; k < 8; k++) s += (k == 0 ? .35355339 : .5)*texelFetch(uIn, ivec2(p.x, b + k), 0).rgb*cos(float(2*n + 1)*float(k)*PI/16.);
  o = vec4(s, 1.);
}`;
const FS_IDCT_H = HEAD + `
uniform sampler2D uIn;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy); int n = p.x % 8, b = p.x - n;
  vec3 s = vec3(0.);
  for (int k = 0; k < 8; k++) s += (k == 0 ? .35355339 : .5)*texelFetch(uIn, ivec2(b + k, p.y), 0).rgb*cos(float(2*n + 1)*float(k)*PI/16.);
  float y = s.x + .5;
  o = vec4(clamp(vec3(y + 1.402*s.z, y - .344136*s.y - .714136*s.z, y + 1.772*s.y), 0., 1.), 1.);
}`;

// Pass 6: temporal — skipped macroblocks (P-frame smear) and ghosting
const FS_TEMPORAL = HEAD + `
uniform sampler2D uCur, uPrev; uniform float uPersist, uSkip, uFrame;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec3 c = texelFetch(uCur, p, 0).rgb, pr = texelFetch(uPrev, p, 0).rgb;
  float skip = step(h(floor(vec2(p)/16.) + uFrame*.1234), uSkip);
  o = vec4(mix(c, pr, max(skip, uPersist)), 1.);
}`;
const FS_DISPLAY = HEAD + `
uniform sampler2D uIn;
void main(){ o = texelFetch(uIn, ivec2(gl_FragCoord.xy), 0); }`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    u[info.name.replace('[0]', '')] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}
function makeTarget(w, h, half) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (half) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fb, ok };
}
function freeTarget(t) { if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); } }
function pass(P, target, w, h, texs, setUniforms) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(P.p);
  texs.forEach(([name, tex], i) => { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(P.u[name], i); });
  if (setUniforms) setUniforms(P.u);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let P, srcTex, canFloat = false;
function initGL() {
  canFloat = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
  P = { tape: program(FS_TAPE), dh: program(FS_DCT_H), dv: program(FS_DCT_V), iv: program(FS_IDCT_V),
        ih: program(FS_IDCT_H), temporal: program(FS_TEMPORAL), display: program(FS_DISPLAY) };
  srcTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

// Tape resolution (W×H) varies per era; the output canvas stays fixed so eras can change mid-recording.
let W = 0, H = 0, T = {}, frameNo = 0, portrait = false;
function setupTargets() {
  const p = PRESETS[pi];
  [W, H] = portrait ? [p.res[1], p.res[0]] : p.res;
  glc.width = W; glc.height = H;
  Object.values(T).flat().forEach(freeTarget);
  T = { tape: makeTarget(W, H), idct: makeTarget(W, H), o: [makeTarget(W, H), makeTarget(W, H)] };
  if (canFloat) {
    T.a = makeTarget(W, H, true); T.b = makeTarget(W, H, true);
    if (!T.a.ok || !T.b.ok) canFloat = false;
  }
  frameNo = 0;
}
function setupOutput() {
  portrait = innerHeight > innerWidth;
  [out.width, out.height] = portrait ? [480, 640] : [640, 480];
  setupTargets();
}

function renderGL(t) {
  const p = PRESETS[pi], m = LEVELS[li].m;
  const el = usingTest ? testCanvas : video;
  const sw = usingTest ? testCanvas.width : video.videoWidth, sh = usingTest ? testCanvas.height : video.videoHeight;
  if (!sw || !sh) return false;

  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
  gl.generateMipmap(gl.TEXTURE_2D);

  // cover-crop the camera to the output aspect (pixels may be non-square at tape res, like real QCIF)
  const sa = sw / sh, ta = out.width / out.height;
  let cx = 1, cy = 1;
  if (sa > ta) cx = ta / sa; else cy = sa / ta;

  pass(P.tape, T.tape, W, H, [['uSrc', srcTex]], u => {
    gl.uniform2f(u.uRes, W, H); gl.uniform1f(u.uTime, t);
    gl.uniform4f(u.uCrop, cx, cy, (1 - cx) / 2, (1 - cy) / 2);
    gl.uniform1f(u.uMirror, facing === 'user' && !usingTest ? 1 : 0);
    gl.uniform1f(u.uTape, p.tape * Math.min(m, 1.4)); gl.uniform1f(u.uTrack, p.track * m);
    gl.uniform1f(u.uBleed, p.bleed * (.7 + .3 * m)); gl.uniform1f(u.uNoise, p.noise * m);
    gl.uniform1f(u.uSat, p.sat); gl.uniform1f(u.uSharp, p.sharp); gl.uniform1f(u.uHead, p.head);
    gl.uniform1f(u.uContrast, p.contrast); gl.uniform1f(u.uBright, p.bright); gl.uniform3fv(u.uTint, p.tint);
  });
  let cur = T.tape.tex;
  if (p.q > 0 && canFloat) {
    pass(P.dh, T.a, W, H, [['uIn', T.tape.tex]]);
    pass(P.dv, T.b, W, H, [['uIn', T.a.tex]], u => {
      gl.uniform1f(u.uQ, p.q * m); gl.uniform1f(u.uQc, p.qc * m); gl.uniform1f(u.uCut, m > 1.3 ? Math.max(1, p.cut - 1) : p.cut);
    });
    pass(P.iv, T.a, W, H, [['uIn', T.b.tex]]);
    pass(P.ih, T.idct, W, H, [['uIn', T.a.tex]]);
    cur = T.idct.tex;
  }
  // a "keyframe" every ~2s clears the smear, as real codecs did
  const key = frameNo < 2 || frameNo % Math.round(p.fps * 2) === 0;
  const dst = T.o[frameNo & 1], prev = T.o[(frameNo + 1) & 1];
  pass(P.temporal, dst, W, H, [['uCur', cur], ['uPrev', prev.tex]], u => {
    gl.uniform1f(u.uPersist, key ? 0 : p.persist); gl.uniform1f(u.uSkip, key ? 0 : Math.min(.6, p.skip * m));
    gl.uniform1f(u.uFrame, frameNo % 997);
  });
  pass(P.display, null, W, H, [['uIn', dst.tex]]);
  frameNo++;
  return true;
}

// ---------- 2D composite: upscale + on-screen display (burned into the recording) ----------
const scanPattern = (() => {
  const c = document.createElement('canvas'); c.width = 1; c.height = 4;
  const x = c.getContext('2d'); x.fillStyle = 'rgba(0,0,0,.16)'; x.fillRect(0, 2, 1, 2);
  return octx.createPattern(c, 'repeat');
})();
const MONTHS = ['JAN.', 'FEB.', 'MAR.', 'APR.', 'MAY', 'JUN.', 'JUL.', 'AUG.', 'SEP.', 'OCT.', 'NOV.', 'DEC.'];

function drawStamp() {
  const d = new Date(), hr = d.getHours(), mm = String(d.getMinutes()).padStart(2, '0');
  const l1 = clock24 ? `${hr}:${mm}` : `${hr < 12 ? 'AM' : 'PM'} ${(hr % 12) || 12}:${mm}`;
  const l2 = `${MONTHS[d.getMonth()]}${String(d.getDate()).padStart(3, ' ')} ${d.getFullYear()}`;
  const fs = Math.round(Math.min(out.width, out.height) * .075);
  octx.font = `bold ${fs}px "Courier New", Courier, monospace`;
  octx.textAlign = 'right'; octx.textBaseline = 'alphabetic';
  const x = out.width - fs * .9, y2 = out.height - fs * .9, y1 = y2 - fs * 1.15;
  for (const [s, y] of [[l1, y1], [l2, y2]]) {
    octx.fillStyle = 'rgba(0,0,0,.55)'; octx.fillText(s, x + 2, y + 2);
    octx.fillStyle = '#f2efe2'; octx.fillText(s, x, y);
  }
}
function drawBuffering(pct) {
  const fs = Math.round(Math.min(out.width, out.height) * .05);
  octx.font = `${fs}px Verdana, sans-serif`; octx.textAlign = 'center'; octx.textBaseline = 'middle';
  const s = `Buffering... ${pct}%`, w = octx.measureText(s).width + fs * 1.6;
  octx.fillStyle = 'rgba(0,0,0,.75)'; octx.fillRect((out.width - w) / 2, out.height / 2 - fs, w, fs * 2);
  octx.fillStyle = '#fff'; octx.fillText(s, out.width / 2, out.height / 2);
}
function composite(buffering) {
  const p = PRESETS[pi];
  octx.imageSmoothingEnabled = p.smooth;
  octx.drawImage(glc, 0, 0, out.width, out.height);
  if (p.scan) { octx.fillStyle = scanPattern; octx.fillRect(0, 0, out.width, out.height); }
  if (p.stamp) drawStamp();
  if (buffering) drawBuffering(bufPct);
}

let running = false, last = 0, stallUntil = 0, bufPct = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (!running || !$('#sheet').hidden) return; // pause while reviewing a clip so playback and buttons stay smooth
  const p = PRESETS[pi], m = LEVELS[li].m;
  if (usingTest) drawTest(now);
  if (now - last < 1000 / p.fps - 2) return;
  last = now;
  if (now < stallUntil) { bufPct = Math.min(99, bufPct + Math.round(Math.random() * 12)); composite(true); return; }
  if (p.stall && frameNo > p.fps && Math.random() < p.stall * m / p.fps) {
    stallUntil = now + 400 + Math.random() * 1400; bufPct = Math.round(Math.random() * 40);
    composite(!!p.buffer); return;
  }
  if (renderGL(now / 1000)) composite(false);
}

// ---------- Camera / test pattern ----------
const video = document.createElement('video');
video.muted = true; video.playsInline = true; video.setAttribute('playsinline', '');
let stream = null, facing = 'environment', usingTest = false;

const testCanvas = document.createElement('canvas'); testCanvas.width = 640; testCanvas.height = 480;
const tctx = testCanvas.getContext('2d');
function drawTest(now) {
  const w = 640, hh = 480, t = now / 1000;
  const bars = ['#c0c0c0', '#c0c000', '#00c0c0', '#00c000', '#c000c0', '#c00000', '#0000c0'];
  bars.forEach((c, i) => { tctx.fillStyle = c; tctx.fillRect(i * w / 7, 0, w / 7 + 1, hh * .62); });
  const g = tctx.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#000'); g.addColorStop(1, '#fff');
  tctx.fillStyle = g; tctx.fillRect(0, hh * .62, w, hh * .13);
  tctx.fillStyle = '#1a2a48'; tctx.fillRect(0, hh * .75, w, hh * .25);
  tctx.fillStyle = '#ffcc33';
  tctx.beginPath(); tctx.arc(w / 2 + Math.sin(t * 1.3) * 220, hh * .45 + Math.cos(t * 1.7) * 90, 46, 0, 7); tctx.fill();
  tctx.fillStyle = '#fff'; tctx.font = 'bold 44px sans-serif'; tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
  tctx.fillText('テスト映像 ' + new Date().toLocaleTimeString('ja-JP'), w / 2, hh * .875);
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  const v = { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }; // tape res is ≤320px, more only costs upload time
  const md = navigator.mediaDevices;
  if (md && md.getUserMedia) {
    try { stream = await md.getUserMedia({ video: v, audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } }); }
    catch (e) { try { stream = await md.getUserMedia({ video: v }); } catch (e2) { stream = null; } }
  }
  if (stream) {
    usingTest = false;
    video.srcObject = stream;
    await video.play().catch(() => {});
    connectMic();
  } else {
    usingTest = true;
    toast('カメラが使えないため、テスト映像を表示しています');
  }
}

// ---------- Audio: mono, narrow band, hiss, bit reduction ----------
let actx, micSrc, lp, noiseGain, shaper, dest;
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  dest = actx.createMediaStreamDestination();
  const mono = actx.createGain(); mono.channelCount = 1; mono.channelCountMode = 'explicit';
  const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 220;
  lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = .9;
  shaper = actx.createWaveShaper();
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -24; comp.ratio.value = 6;
  mono.connect(hp).connect(lp).connect(shaper).connect(comp).connect(dest);
  const nb = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const ns = actx.createBufferSource(); ns.buffer = nb; ns.loop = true;
  const nf = actx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 3000; nf.Q.value = .5;
  noiseGain = actx.createGain();
  ns.connect(nf).connect(noiseGain).connect(comp); ns.start();
  initAudio.mono = mono;
  applyAudio();
}
function connectMic() {
  if (!actx) return;
  if (micSrc) micSrc.disconnect();
  micSrc = null;
  if (stream && stream.getAudioTracks().length) { micSrc = actx.createMediaStreamSource(stream); micSrc.connect(initAudio.mono); }
}
function applyAudio() {
  if (!actx) return;
  const a = PRESETS[pi].audio, m = LEVELS[li].m;
  lp.frequency.value = a.lp / Math.sqrt(m);
  noiseGain.gain.value = a.noise * m;
  const steps = Math.pow(2, Math.max(3, a.bits - (m > 1.3 ? 1 : 0))) / 2, c = new Float32Array(4096);
  for (let i = 0; i < c.length; i++) { const x = i / 2047.5 - 1; c[i] = a.bits >= 16 ? x : Math.round(x * steps) / steps; }
  shaper.curve = c;
}

// ---------- Recording ----------
let rec = null, chunks = [], recStart = 0, timerId = 0, lastClip = null;
function pickMime() {
  if (!window.MediaRecorder) return null;
  return ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
}
function startRec() {
  const mime = pickMime();
  if (mime === null) { toast('このブラウザは録画に対応していません'); return; }
  const tracks = [...out.captureStream(30).getVideoTracks()];
  if (dest) tracks.push(...dest.stream.getAudioTracks());
  const opts = { videoBitsPerSecond: 2_000_000, audioBitsPerSecond: 96_000 };
  if (mime) opts.mimeType = mime;
  try { rec = new MediaRecorder(new MediaStream(tracks), opts); }
  catch (e) { toast('録画を開始できませんでした'); return; }
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = finishRec;
  rec.start(1000);
  recStart = performance.now();
  app.classList.add('recording');
  $('#flip').disabled = true;
  timerId = setInterval(updateTimer, 250);
}
function stopRec() { if (rec && rec.state !== 'inactive') rec.stop(); }
function updateTimer() {
  const s = recStart ? Math.floor((performance.now() - recStart) / 1000) : 0;
  $('#time').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
function finishRec() {
  clearInterval(timerId); recStart = 0; updateTimer();
  app.classList.remove('recording');
  $('#flip').disabled = usingTest;
  const type = (rec.mimeType || 'video/webm').split(';')[0];
  const blob = new Blob(chunks, { type });
  const p = PRESETS[pi], d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}${String(d.getSeconds()).padStart(2, '0')}`;
  if (lastClip) URL.revokeObjectURL(lastClip.url);
  lastClip = { blob, url: URL.createObjectURL(blob), name: `heisei_${p.year}_${stamp}.${type.includes('mp4') ? 'mp4' : 'webm'}`, type };
  const th = $('#thumb'); th.style.backgroundImage = `url(${out.toDataURL('image/jpeg', .6)})`; th.disabled = false;
  openSheet();
}
function openSheet() {
  if (!lastClip) return;
  const v = $('#playback'); v.src = lastClip.url; v.play().catch(() => {});
  const a = $('#save'); a.href = lastClip.url; a.download = lastClip.name;
  $('#clipMeta').textContent = `${lastClip.name} · ${(lastClip.blob.size / 1048576).toFixed(1)} MB`;
  $('#sheet').hidden = false;
}
$('#close').onclick = () => { $('#playback').pause(); $('#sheet').hidden = true; };
$('#share').onclick = async () => {
  const file = new File([lastClip.blob], lastClip.name, { type: lastClip.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'HEISEI CAM' }); } catch (e) {}
  } else toast('このブラウザでは共有できません。「保存」を使ってください');
};

// ---------- UI ----------
let toastId = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastId); toastId = setTimeout(() => t.classList.remove('show'), 3200);
}
let flashId = 0;
function selectPreset(i, scroll = true) {
  pi = (i + PRESETS.length) % PRESETS.length;
  const p = PRESETS[pi];
  [...$('#modes').children].forEach((b, j) => b.classList.toggle('on', j === pi));
  if (scroll) centerMode(true);
  $('#spec').textContent = `${p.res[0]}×${p.res[1]} · ${p.fps}fps`;
  const f = $('#eraFlash'); f.textContent = `${p.year} ${p.name}`; f.classList.add('show');
  clearTimeout(flashId); flashId = setTimeout(() => f.classList.remove('show'), 1100);
  if (gl && P) setupTargets();
  stallUntil = 0;
  applyAudio();
}
function selectLevel(i) {
  li = i;
  [...$('#levels').querySelectorAll('button')].forEach((b, j) => b.classList.toggle('on', j === li));
  applyAudio();
}

PRESETS.forEach((p, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<b>${p.year}</b><small>${p.name}</small>`;
  b.onclick = () => selectPreset(i);
  $('#modes').appendChild(b);
});
LEVELS.forEach((l, i) => {
  const b = document.createElement('button'); b.textContent = l.label; b.onclick = () => selectLevel(i);
  $('#levels').appendChild(b);
});

// scroll only the carousel itself (scrollIntoView could also shift the fixed app on iOS)
function centerMode(smooth) {
  const m = $('#modes'), b = m.children[pi];
  if (m.scrollWidth <= m.clientWidth + 1) return;
  m.scrollTo({ left: b.offsetLeft + b.offsetWidth / 2 - m.clientWidth / 2, behavior: smooth ? 'smooth' : 'auto' });
}
// swiping the carousel selects whichever era it settles on, as camera apps do
let modeScrollId = 0;
$('#modes').addEventListener('scroll', () => {
  clearTimeout(modeScrollId);
  modeScrollId = setTimeout(() => {
    const m = $('#modes');
    if (m.scrollWidth <= m.clientWidth + 1) return;
    const c = m.scrollLeft + m.clientWidth / 2;
    let best = pi, bd = Infinity;
    [...m.children].forEach((b, i) => { const d = Math.abs(b.offsetLeft + b.offsetWidth / 2 - c); if (d < bd) { bd = d; best = i; } });
    if (best !== pi) selectPreset(best, false);
  }, 140);
}, { passive: true });
document.addEventListener('touchstart', () => {}, { passive: true });

// swipe on the viewfinder changes era, like switching camera modes
let sx = null, sy = 0;
out.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
out.addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) selectPreset(pi + (dx < 0 ? 1 : -1));
  sx = null;
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') selectPreset(pi + 1);
  if (e.key === 'ArrowLeft') selectPreset(pi - 1);
  if (e.key === ' ' && running && $('#sheet').hidden) { e.preventDefault(); $('#shutter').click(); }
});

// date-stamp clock format, remembered per device
let clock24 = false;
try { clock24 = localStorage.getItem('heisei-clock') === '24'; } catch (e) {}
function renderClock() { $('#clock').textContent = clock24 ? '24H' : '12H'; }
$('#clock').onclick = () => {
  clock24 = !clock24; renderClock();
  try { localStorage.setItem('heisei-clock', clock24 ? '24' : '12'); } catch (e) {}
  toast(clock24 ? '時刻を24時間表記にしました' : '時刻を12時間表記（AM/PM）にしました');
};
renderClock();

$('#shutter').onclick =() => { if (rec && rec.state === 'recording') stopRec(); else startRec(); };
$('#thumb').onclick = openSheet;
$('#flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; await startCamera(); };
addEventListener('resize', () => {
  centerMode(false);
  if (!P || (rec && rec.state === 'recording')) return;
  if ((innerHeight > innerWidth) !== portrait) setupOutput();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopRec(); });

$('#start').onclick = async () => {
  if (!gl) { toast('このブラウザはWebGL2に対応していません'); return; }
  try { initGL(); } catch (e) { console.error(e); toast('シェーダーの初期化に失敗しました'); return; }
  try { initAudio(); if (actx && actx.state === 'suspended') await actx.resume(); } catch (e) { console.warn(e); }
  setupOutput();
  await startCamera();
  $('#flip').disabled = usingTest;
  $('#splash').hidden = true; $('#splash').style.display = 'none';
  selectPreset(0); selectLevel(1);
  if (!canFloat) toast('この端末ではブロックノイズを省略しています');
  running = true;
};
requestAnimationFrame(loop);
</script>
</body>
</html>
